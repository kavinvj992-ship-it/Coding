<!DOCTYPE html>
<html>
<head>
<title>Tic Tac Toe</title>

<style>

body{
    text-align:center;
    font-family:Arial;
}

.board{
    display:grid;
    grid-template-columns:repeat(3,100px);
    gap:5px;
    justify-content:center;
    margin-top:20px;
}

.cell{
    width:100px;
    height:100px;
    background:#eee;
    font-size:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

</style>
</head>

<body>

<h1>Tic Tac Toe</h1>
<h3 id="status">Player X Turn</h3>

<div class="board">
<div class="cell" onclick="play(this,0)"></div>
<div class="cell" onclick="play(this,1)"></div>
<div class="cell" onclick="play(this,2)"></div>
<div class="cell" onclick="play(this,3)"></div>
<div class="cell" onclick="play(this,4)"></div>
<div class="cell" onclick="play(this,5)"></div>
<div class="cell" onclick="play(this,6)"></div>
<div class="cell" onclick="play(this,7)"></div>
<div class="cell" onclick="play(this,8)"></div>
</div>

<br>
<button onclick="restart()">Restart Game</button>

<script>

let currentPlayer="X";
let board=["","","","","","","","",""];

let winPatterns=[
[0,1,2],
[3,4,5],
[6,7,8],
[0,3,6],
[1,4,7],
[2,5,8],
[0,4,8],
[2,4,6]
];

function play(cell,index){

if(board[index]!=""){
return;
}

board[index]=currentPlayer;
cell.innerHTML=currentPlayer;

if(checkWin()){
document.getElementById("status").innerHTML="Player "+currentPlayer+" Wins!";
return;
}

currentPlayer = currentPlayer=="X" ? "O":"X";
document.getElementById("status").innerHTML="Player "+currentPlayer+" Turn";

}

function checkWin(){

for(let pattern of winPatterns){

let a=pattern[0];
let b=pattern[1];
let c=pattern[2];

if(board[a] && board[a]==board[b] && board[a]==board[c]){
return true;
}

}

return false;

}

function restart(){

location.reload();

}

</script>

</body>
</html>
